name: authz

# Default logging configuration
x-logging:
  &default-logging
  driver: json-file
  options:
    max-size: 5m
    max-file: 3

# Service definitions

services:
  db:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    ports:
      - 5432:5432
    environment:
      PGDATA: /var/lib/postgresql/pgdata-dev
      POSTGRES_DB: authz
      POSTGRES_USER: authz
      POSTGRES_PASSWORD: authz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authz -d authz"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - db-data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.9.1
    restart: always
    logging: *default-logging
    ports:
      - 9092:9092
    environment:
      # Kafka basic configuration
      CLUSTER_ID: kafka
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Kafka listener configuration
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9094,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9094,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Kafka other configuration
      # Topics are provisioned (kafka-init here, infra in production), never auto-created
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
      KAFKA_LOG4J_LOGGERS: "kafka.controller=ERROR,kafka.producer.async.DefaultEventHandler=ERROR,state.change.logger=ERROR"
      CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    healthcheck:
      test: nc -z localhost 9092
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Creates the service topics, as infra does in production. The services
  # never create topics; they wait for them.
  kafka-init:
    image: confluentinc/cp-kafka:7.9.1
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in authz.permission-events authz.permission-events.dlq; do
          kafka-topics --bootstrap-server kafka:9094 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  kafbat:
    logging: *default-logging
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: always
    ports:
      - 9080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: 'kafka'
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: 'kafka:9094'
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: always
    logging: *default-logging
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 5s
    volumes:
      - redis-data:/data
    command: [
      "redis-server",
      # Uncomment the line below to set a password
      # "--requirepass", "mysecretpassword",
      "--appendonly", "yes"
    ]

  redisinsight:
    image: redis/redisinsight:3.8.0
    restart: always
    logging: *default-logging
    container_name: redisinsight
    ports:
      - "9081:5540"
    environment:
      - RI_APP_PORT=5540
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - path: .env
        required: false
      - path: .env.api
        required: false
    ports:
      - 3000:3000
    labels:
      - "authz.swagger=http://localhost:3000/swagger/index.html"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    # The worker drains its in-flight event for up to 10 s on SIGTERM; the
    # default 10 s grace period would SIGKILL it mid-drain.
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
      - path: .env.worker
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://authz:authz@db:5432/authz?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
    driver: local
  kafka-data:
    driver: local
  redis-data:
    driver: local
  redisinsight-data:
    driver: local
